<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#00AEEF" />

    <title>MYHitch Pass — Discover & Book Live Events in Australia</title>
    <meta name="description" content="MYHitch Pass is Australia's premium event discovery and ticketing platform for concerts, music festivals, sports, theatre, and live tours. Secure tickets, instant digital passes." />
    <meta name="keywords" content="event tickets, concert tickets australia, festival tickets, live events, ticketing platform, MYHitch Pass, become an organiser, sell event tickets" />
    <meta name="author" content="MYHitch Pass Australia" />
    <meta name="robots" content="index, follow" />

    <link rel="canonical" href="https://myhitchpass.com.au/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Preconnect to image CDN used by mock events -->
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />
    <link rel="dns-prefetch" href="https://images.unsplash.com" />

    <!-- Preconnect to Google Fonts for faster header/body font loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MYHitch Pass" />
    <meta property="og:title" content="MYHitch Pass — Discover & Book Live Events" />
    <meta property="og:description" content="Browse live concerts, music festivals, sports, and tours. Secure ticketing and instant digital passes." />
    <meta property="og:url" content="https://myhitchpass.com.au/" />
    <meta property="og:image" content="https://myhitchpass.com.au/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_AU" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MYHitch Pass — Discover & Book Live Events" />
    <meta name="twitter:description" content="Browse live concerts, music festivals, sports, and tours. Secure ticketing and instant digital passes." />
    <meta name="twitter:image" content="https://myhitchpass.com.au/og-image.png" />

    <!-- JSON-LD structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "MYHitch Pass",
        "url": "https://myhitchpass.com.au/",
        "logo": "https://myhitchpass.com.au/og-image.png",
        "description": "Australia's premium event discovery and ticketing platform for concerts, festivals, sports, and live tours.",
        "contactPoint": {
          "@type": "ContactPoint",
          "email": "support@myhitchpass.com.au",
          "contactType": "customer support",
          "areaServed": "AU"
        }
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "MYHitch Pass",
        "url": "https://myhitchpass.com.au/",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://myhitchpass.com.au/?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="padding:2rem;font-family:system-ui,sans-serif;text-align:center">
        <h1>MYHitch Pass</h1>
        <p>JavaScript is required to use MYHitch Pass. Please enable it and reload.</p>
        <p>Need a hand? Email <a href="mailto:support@myhitchpass.com.au">support@myhitchpass.com.au</a>.</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
